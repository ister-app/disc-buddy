name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0

      - name: Install dependencies
        run: dart pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed disc_buddy_lib/lib disc_buddy_cli/lib disc_buddy_cli/bin
        continue-on-error: true

      - name: Analyze lib
        run: dart analyze --fatal-infos
        working-directory: disc_buddy_lib

      - name: Analyze CLI
        run: dart analyze --fatal-infos
        working-directory: disc_buddy_cli

      - name: Test lib
        run: dart test
        working-directory: disc_buddy_lib

      - name: Test CLI
        run: dart test
        working-directory: disc_buddy_cli

      - name: Compile
        # Tags become the --version string; other builds report the short SHA.
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) VERSION="${GITHUB_SHA::7}";; esac
          dart compile exe bin/rip.dart -DDISC_BUDDY_VERSION="$VERSION" -o ../disc-buddy-cli-linux-x64
        working-directory: disc_buddy_cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disc-buddy-cli-linux-x64
          path: disc-buddy-cli-linux-x64
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: disc-buddy-cli-linux-x64
          generate_release_notes: true

  # Early warning for the next SDK: analyze + test on the stable channel.
  # Failures here never block a push or release.
  build-stable:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get
      - run: dart analyze --fatal-infos disc_buddy_lib disc_buddy_cli
      - run: dart test
        working-directory: disc_buddy_lib
      - run: dart test
        working-directory: disc_buddy_cli

  build-ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install dependencies
        run: flutter pub get
        working-directory: disc_buddy_ui

      - name: Analyze
        run: flutter analyze --fatal-infos
        working-directory: disc_buddy_ui

      - name: Test
        run: flutter test
        working-directory: disc_buddy_ui

      - name: Build Linux
        run: flutter build linux --release
        working-directory: disc_buddy_ui

      - name: Archive bundle
        run: tar -czf disc-buddy-ui-linux-x64.tar.gz -C disc_buddy_ui/build/linux/x64/release bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disc-buddy-ui-linux-x64
          path: disc-buddy-ui-linux-x64.tar.gz
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: disc-buddy-ui-linux-x64.tar.gz
          generate_release_notes: false
