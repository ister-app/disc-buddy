name: disc_buddy_ui
description: Flutter GUI for disc_buddy - rip Audio CDs, DVDs and Blu-rays.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  disc_buddy:
    path: ../disc_buddy_lib
  flutter_riverpod: ^3.4.3
  skeletonizer: ^3.0.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  path: ^1.9.1

# jni (transitive via path_provider_android) is compiled for the host by its
# build hook even on Linux. Its dartjni.c calls AttachCurrentThread(vm, &jniEnv,
# NULL) where jniEnv is a JNIEnv*, which only type-checks against the Android
# flavour of jni.h; the JDK's declares that parameter void**, and passing
# JNIEnv** to it is an error (not a warning) on GCC 14+ and clang 15+.
#   - 1.0.0 handles both via its __ENVP_CAST macro.
#   - 1.0.3 dropped the macro and instead points CMake at its own bundled
#     third_party/jni.h — but only when JAVA_INCLUDE_PATH is unset, i.e. when no
#     JDK headers are installed. Machines (and CI runners) that do have a JDK
#     resolve the JDK header instead and fail to build.
# Verified 2026-08-13 against jni 1.0.3, and 2026-10-10 against jni 1.1.0
# (dartjni.h still passes JNIEnv** uncast): builds here only because this host
# has JDK runtimes but no headers. jni_flutter >= 1.0.3 requires jni ^1.1.0, so
# it is pinned together with jni.
dependency_overrides:
  jni: 1.0.0
  jni_flutter: 1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
