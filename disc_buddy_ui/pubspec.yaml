name: disc_buddy_ui
description: Flutter GUI for disc_buddy - rip Audio CDs, DVDs and Blu-rays.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  disc_buddy:
    path: ../disc_buddy_lib
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  skeletonizer: ^2.1.3
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  path: ^1.9.0

# jni (transitive via path_provider_android) is compiled for the host by its
# build hook even on Linux. Versions after 1.0.0 dropped the __ENVP_CAST macro
# around AttachCurrentThread, so dartjni.h/.c no longer compile against the
# non-Android jni.h (JNIEnv** vs void**) — an error, not a warning, on GCC 14+.
dependency_overrides:
  jni: 1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
